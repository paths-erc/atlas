name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel a run in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Fail the deploy on high/critical advisories in what ships to the browser.
      # (build tooling such as react-scripts is excluded: it is not in the bundle)
      - run: npm audit --omit=dev --audit-level=high

      # CI=false so CRA build warnings are not treated as errors
      # (matches the local `npm run build` behaviour).
      #
      # REACT_APP_API_BASE / REACT_APP_APP come from the committed .env.production.
      # REACT_APP_API_KEY is a read-only BraDypUS v5 key for the `paths` app; it is
      # baked into the client bundle at build time, so store it as a repo secret
      # (Settings → Secrets and variables → Actions → New repository secret:
      # REACT_APP_API_KEY) rather than committing it.
      - run: npm run build
        env:
          CI: false
          REACT_APP_API_KEY: ${{ secrets.REACT_APP_API_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
